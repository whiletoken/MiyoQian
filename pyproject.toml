[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myq"
version = "0.1.0"
description = "简洁的米游社签到与日常助手"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0.1",
    "qrcode>=7.4.2",
    "loguru>=0.7.2",
    "pyfiglet>=1.0.2",
    "Pillow>=12.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["miyouqian"]

[tool.hatch.build.targets.sdist]
include = [
    "/miyouqian",
    "/main.py",
    "/config.example.yaml",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = "--assert=plain"
